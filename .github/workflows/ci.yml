name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt -r requirements-dev.txt

      - name: Environment diagnostics
        run: |
          python --version
          pip --version
          python -c "import fastapi, pydantic, pytest; print('fastapi', fastapi.__version__); print('pydantic', pydantic.__version__); print('pytest', pytest.__version__)"

      - name: Run tests
        run: |
          python -m pytest -q tests -ra
